name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python manage.py check

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/isolatedlun/ai_inventory:latest -f Containerfile .
      - name: Push Docker image
        run: docker push ghcr.io/isolatedlun/ai_inventory:latest

  deploy:
    needs: test
    runs-on: [self-hosted]
    steps:
      - name: Check Docker
        shell: bash
        run: podman info
      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_PASS: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_PASS" |
            podman login ghcr.io --username "$GHCR_USER" --password-stdin


      - name: Pull image
        shell: bash
        run: podman pull --platform linux/amd64 ghcr.io/isolatedlun/ai_inventory:latest
      
      - name: Deploy
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUNNER_TRACKING_ID: ""
        run: |
          podman rm -f ai_inventory || true

          podman run -d \
            --platform linux/amd64 \
            --name ai_inventory \
            --restart unless-stopped \
            -p 127.0.0.1:8000:8000 \
            -e GEMINI_API_KEY \
            ghcr.io/isolatedlun/ai_inventory:latest
